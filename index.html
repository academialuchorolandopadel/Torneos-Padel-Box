<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Torneos Padel Box</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Firebase SDK desde CDN -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
      import {
        getFirestore,
        collection,
        doc,
        setDoc,
        getDoc,
        getDocs,
        updateDoc,
        deleteDoc,
        query,
        where,
        addDoc,
        writeBatch,
      } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCLTUjDNvDq1KdEIZwWrcDWoPYgPXOIzfo",
        authDomain: "padelbox-torneos.firebaseapp.com",
        projectId: "padelbox-torneos",
        storageBucket: "padelbox-torneos.firebasestorage.app",
        messagingSenderId: "21531178710",
        appId: "1:21531178710:web:57879e6e1d5fdd237d3b77",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);

      window.db = db;
      window.auth = auth;
      window.firestore = {
        collection,
        doc,
        setDoc,
        getDoc,
        getDocs,
        updateDoc,
        deleteDoc,
        query,
        where,
        addDoc,
        writeBatch,
      };
      window.firebaseAuth = {
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged,
      };
      console.log("🔥 Firebase conectado (Firestore + Auth)");
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
